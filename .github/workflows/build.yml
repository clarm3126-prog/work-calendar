name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/work-calendar.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-calendar-apk
          path: out/work-calendar.apk
          if-no-files-found: error

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            자동 빌드된 디버그 APK입니다.
            폰에서 바로 받으려면 아래 링크를 사용하세요.
            https://github.com/${{ github.repository }}/releases/latest/download/work-calendar.apk
          files: out/work-calendar.apk
          make_latest: 'true'
